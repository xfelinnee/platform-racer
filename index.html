<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Platform Racer</title>
  <link rel="icon" type="image/png" href="assets/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>

    <!-- LOGIN / PROFILE SELECT -->
    <section id="login" class="screen active">
      <div class="menu-bg">
        <div class="grid-floor"></div>
        <div class="glow glow-a"></div>
        <div class="glow glow-b"></div>
      </div>
      <div class="panel">
        <h2 class="panel-title">SELECT PROFILE</h2>
        <div id="profileList" class="profile-list"></div>
        <div class="new-profile">
          <input type="text" id="newProfileName" maxlength="16" placeholder="New profile name..." />
          <button class="btn small-btn" data-action="create"><span class="btn-label">Create</span><span class="btn-glow"></span></button>
        </div>
        <p id="loginError" class="login-error"></p>
      </div>
    </section>

    <!-- MAIN MENU -->
    <section id="menu" class="screen">
      <div class="menu-bg">
        <div class="grid-floor"></div>
        <div class="glow glow-a"></div>
        <div class="glow glow-b"></div>
      </div>
      <div class="profile-chip" id="profileChip">
        <span class="chip-name" id="chipName">Player</span>
        <span class="chip-coins"><span class="coin-ico"></span><span id="chipCoins">0</span></span>
        <button class="chip-switch" data-action="switch">Switch</button>
      </div>
      <div class="menu-character" id="menuCharacter">
        <div class="mc-stage"><canvas id="menuCharCanvas" width="180" height="240"></canvas></div>
        <button class="btn mc-customize" data-action="customize">
          <span class="btn-label">Customize</span>
          <span class="btn-glow"></span>
        </button>
      </div>
      <div class="menu-content">
        <h1 class="title">
          <span class="title-top">PLATFORM</span>
          <span class="title-bottom">RACER</span>
        </h1>
        <p class="tagline">DASH &middot; LEAP &middot; SURVIVE</p>
        <div class="level-bar" id="levelBar">
          <div class="lvl-info">
            <span class="lvl-badge" id="lvlBadge">LVL 1</span>
            <span class="prestige-badge" id="prestigeBadge"></span>
            <span class="xp-text" id="xpText">0 / 100 XP</span>
          </div>
          <div class="xp-track"><div class="xp-fill" id="xpFill"></div></div>
          <button class="prestige-btn" id="prestigeBtn" style="display:none">PRESTIGE &#9733;</button>
        </div>
        <nav class="menu-buttons">
          <button class="btn" data-action="play">
            <span class="btn-label">Single Player</span>
            <span class="btn-glow"></span>
          </button>
          <button class="btn" data-action="shop">
            <span class="btn-label">Shop</span>
            <span class="btn-glow"></span>
          </button>
          <button class="btn" data-action="profile">
            <span class="btn-label">Profile</span>
            <span class="btn-glow"></span>
          </button>
          <button class="btn" data-action="settings">
            <span class="btn-label">Settings</span>
            <span class="btn-glow"></span>
          </button>
          <button class="btn btn-quit" data-action="quit">
            <span class="btn-label">Quit Game</span>
            <span class="btn-glow"></span>
          </button>
        </nav>
        <footer class="credits">v1.1 &middot; Use A/D or Arrow Keys &middot; Space to Jump</footer>
      </div>
    </section>

    <!-- CUSTOMIZE (quick equip) -->
    <section id="customize" class="screen">
      <div class="menu-bg">
        <div class="grid-floor"></div>
      </div>
      <div class="panel customize-panel">
        <h2 class="panel-title">CUSTOMIZE</h2>
        <div class="customize-body">
          <div class="customize-stage">
            <canvas id="customizeCanvas" width="200" height="280"></canvas>
          </div>
          <div class="customize-options" id="customizeOptions"></div>
        </div>
        <button class="btn back-btn" data-action="back"><span class="btn-label">Done</span><span class="btn-glow"></span></button>
      </div>
    </section>

    <!-- SHOP -->
    <section id="shop" class="screen">
      <div class="menu-bg">
        <div class="grid-floor"></div>
      </div>
      <div class="panel shop-panel">
        <div class="shop-header">
          <h2 class="panel-title">SHOP</h2>
          <div class="shop-balance"><span class="coin-ico"></span><span id="shopCoins">0</span></div>
        </div>
        <div class="shop-tabs" id="shopTabs">
          <button class="shop-tab on" data-tab="buffs">Buffs</button>
          <button class="shop-tab" data-tab="items">Items</button>
          <button class="shop-tab" data-tab="colors">Colors</button>
          <button class="shop-tab" data-tab="hats">Hats</button>
          <button class="shop-tab" data-tab="clothes">Clothes</button>
          <button class="shop-tab" data-tab="trails">Trails</button>
        </div>
        <div id="shopItems" class="shop-items"></div>
        <button class="btn back-btn" data-action="back"><span class="btn-label">Back</span><span class="btn-glow"></span></button>
      </div>
    </section>

    <!-- PROFILE -->
    <section id="profile" class="screen">
      <div class="menu-bg">
        <div class="grid-floor"></div>
      </div>
      <div class="panel profile-panel">
        <div class="shop-header">
          <h2 class="panel-title">PROFILE</h2>
          <div class="shop-balance"><span class="coin-ico"></span><span id="profileCoins">0</span></div>
        </div>
        <div class="profile-id">
          <span class="profile-name" id="profileName">Player</span>
          <span class="profile-rank" id="profileRank">Level 1</span>
        </div>
        <div id="profileStats" class="profile-stats"></div>
        <h3 class="profile-subhead">Collection</h3>
        <div id="profileUnlocks" class="profile-unlocks"></div>
        <button class="btn back-btn" data-action="back"><span class="btn-label">Back</span><span class="btn-glow"></span></button>
      </div>
    </section>

    <!-- SETTINGS -->
    <section id="settings" class="screen">
      <div class="menu-bg">
        <div class="grid-floor"></div>
      </div>
      <div class="panel">
        <h2 class="panel-title">SETTINGS</h2>

        <div class="setting-row">
          <label>Music Volume</label>
          <input type="range" id="musicVol" min="0" max="100" value="50" />
          <span class="val" id="musicVolVal">50</span>
        </div>

        <div class="setting-row">
          <label>SFX Volume</label>
          <input type="range" id="sfxVol" min="0" max="100" value="70" />
          <span class="val" id="sfxVolVal">70</span>
        </div>

        <div class="setting-row">
          <label>Difficulty</label>
          <div class="seg" id="difficulty">
            <button data-val="easy">Easy</button>
            <button data-val="normal" class="on">Normal</button>
            <button data-val="hard">Hard</button>
          </div>
        </div>

        <div class="setting-row">
          <label>Particles</label>
          <div class="seg" id="particles">
            <button data-val="on" class="on">On</button>
            <button data-val="off">Off</button>
          </div>
        </div>

        <button class="btn back-btn" data-action="back">
          <span class="btn-label">Back</span>
          <span class="btn-glow"></span>
        </button>
      </div>
    </section>

    <!-- IN-GAME HUD -->
    <div id="hud" class="hud">
      <div class="hud-item">TIME <span id="hudTime">0.0</span></div>
      <div class="hud-item">DIST <span id="hudDist">0</span>m</div>
      <div class="hud-item">BEST <span id="hudBest">0</span>m</div>
      <div class="hud-item hud-coins"><span class="coin-ico"></span><span id="hudCoins">0</span></div>
      <button id="pauseBtn" class="hud-pause">II</button>
    </div>

    <!-- PAUSE / GAME OVER OVERLAY -->
    <section id="overlay" class="screen overlay">
      <div class="panel small">
        <h2 class="panel-title" id="overlayTitle">PAUSED</h2>
        <div class="overlay-best" id="overlayBest"></div>
        <div class="overlay-stats" id="overlayStats"></div>
        <p class="overlay-sub" id="overlaySub"></p>
        <button class="btn" data-action="resume"><span class="btn-label">Resume</span><span class="btn-glow"></span></button>
        <button class="btn" data-action="restart"><span class="btn-label">Restart</span><span class="btn-glow"></span></button>
        <button class="btn btn-quit" data-action="menu"><span class="btn-label">Main Menu</span><span class="btn-glow"></span></button>
      </div>
    </section>
  </div>

  <script src="js/audio.js"></script>
  <script src="js/profiles.js"></script>
  <script src="js/input.js"></script>
  <script src="js/player.js"></script>
  <script src="js/level.js"></script>
  <script src="js/game.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
